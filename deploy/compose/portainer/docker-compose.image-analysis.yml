name: mediafleet-image-analysis

# 图像分析独立 Stack。默认只启动健康接口，不消费任务。
services:
  image-analysis:
    image: ${IMAGE_ANALYSIS_IMAGE:-mediafleet-image-analysis:stable}
    container_name: ${IMAGE_ANALYSIS_CONTAINER_NAME:-mediafleet-image-analysis}
    environment:
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: "8013"
      SERVICE_DOTENV_ENABLED: "false"
      SERVICE_LOG_LEVEL: ${IMAGE_ANALYSIS_LOG_LEVEL:-INFO}
      SERVICE_LOG_DIR: /app/logs
      API_KEY: ${IMAGE_ANALYSIS_API_KEY:-change-this-api-key}
      RUNTIME_CONFIG_ENCRYPTION_KEY: ${RUNTIME_CONFIG_ENCRYPTION_KEY:-}
      RUNTIME_CONFIG_BOOTSTRAP: ${IMAGE_ANALYSIS_CONFIG_BOOTSTRAP:-false}
      APP_ENV: ${APP_ENV:-production}
      TZ: ${TZ:-Asia/Shanghai}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}

      DB_TYPE: ${DB_TYPE:-mysql}
      DB_HOST: ${DB_HOST:-mysql.example.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-mediafleet}
      DB_PASSWORD: ${DB_PASSWORD:-change-this-db-password}
      DB_NAME: ${DB_NAME:-mediafleet}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
      DB_AUTO_INIT: ${DB_AUTO_INIT:-false}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-false}
      DB_INIT_CREATE_SCHEMA: ${DB_INIT_CREATE_SCHEMA:-false}

      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq.example.internal}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-media_service}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-change-this-rabbitmq-password}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      RABBITMQ_HEARTBEAT: ${RABBITMQ_HEARTBEAT:-60}
      RABBITMQ_BLOCKED_TIMEOUT: ${RABBITMQ_BLOCKED_TIMEOUT:-300}

      IMAGE_ANALYSIS_INSTANCE_ID: ${IMAGE_ANALYSIS_INSTANCE_ID:-image-analysis-01}
      MEDIA_NODE_NAME: ${IMAGE_ANALYSIS_NODE_NAME:-image-analysis-01}
      MEDIA_NODE_WEIGHT: ${IMAGE_ANALYSIS_NODE_WEIGHT:-100}
      MEDIA_NODE_HEARTBEAT_CONTROL_CENTER_URL: ${MEDIA_NODE_HEARTBEAT_CONTROL_CENTER_URL:-http://mediafleet-control-center:8008}
      MEDIA_NODE_HEARTBEAT_INTERVAL_SECONDS: ${MEDIA_NODE_HEARTBEAT_INTERVAL_SECONDS:-30}
      MEDIA_NODE_HEARTBEAT_TIMEOUT_SECONDS: ${MEDIA_NODE_HEARTBEAT_TIMEOUT_SECONDS:-5}

      IMAGE_ANALYSIS_CONSUMER_ENABLED: ${IMAGE_ANALYSIS_CONSUMER_ENABLED:-false}
      IMAGE_ANALYSIS_CONSUMER_TIMEOUT_MS: ${IMAGE_ANALYSIS_CONSUMER_TIMEOUT_MS:-0}
      IMAGE_ANALYSIS_MAX_CONCURRENT_CLASSROOMS: ${IMAGE_ANALYSIS_MAX_CONCURRENT_CLASSROOMS:-4}
      IMAGE_ANALYSIS_FFMPEG_CONCURRENCY: ${IMAGE_ANALYSIS_FFMPEG_CONCURRENCY:-4}
      IMAGE_ANALYSIS_DOWNLOAD_CONCURRENCY: ${IMAGE_ANALYSIS_DOWNLOAD_CONCURRENCY:-1}
      IMAGE_ANALYSIS_UPLOAD_CONCURRENCY: ${IMAGE_ANALYSIS_UPLOAD_CONCURRENCY:-4}
      IMAGE_ANALYSIS_MODEL_CONCURRENCY: ${IMAGE_ANALYSIS_MODEL_CONCURRENCY:-4}
      IMAGE_ANALYSIS_FFMPEG_THREADS: ${IMAGE_ANALYSIS_FFMPEG_THREADS:-1}
      IMAGE_ANALYSIS_DEFAULT_MODEL: ${IMAGE_ANALYSIS_DEFAULT_MODEL:-}
      IMAGE_ANALYSIS_ALLOWED_MODELS: ${IMAGE_ANALYSIS_ALLOWED_MODELS:-}
      IMAGE_ANALYSIS_OPENAI_API_KEY: ${IMAGE_ANALYSIS_OPENAI_API_KEY:-}
      IMAGE_ANALYSIS_OPENAI_BASE_URL: ${IMAGE_ANALYSIS_OPENAI_BASE_URL:-https://api.openai.com/v1}
      IMAGE_ANALYSIS_VIDEO_ALLOWED_HOSTS: ${IMAGE_ANALYSIS_VIDEO_ALLOWED_HOSTS:-}
      IMAGE_ANALYSIS_VIDEO_ALLOWED_NETWORKS: ${IMAGE_ANALYSIS_VIDEO_ALLOWED_NETWORKS:-}
      IMAGE_ANALYSIS_VIDEO_ALLOWED_PORTS: ${IMAGE_ANALYSIS_VIDEO_ALLOWED_PORTS:-80,443}
      IMAGE_ANALYSIS_MAX_DOWNLOAD_BYTES: ${IMAGE_ANALYSIS_MAX_DOWNLOAD_BYTES:-4000000000}
      IMAGE_ANALYSIS_MAX_PTS_ERROR_MS: ${IMAGE_ANALYSIS_MAX_PTS_ERROR_MS:-5000}
      IMAGE_ANALYSIS_LEASE_SECONDS: ${IMAGE_ANALYSIS_LEASE_SECONDS:-600}
      IMAGE_ANALYSIS_RESULT_EXCHANGE: ${IMAGE_ANALYSIS_RESULT_EXCHANGE:-image.analysis.result}
      IMAGE_ANALYSIS_RESULT_ROUTING_KEY: ${IMAGE_ANALYSIS_RESULT_ROUTING_KEY:-image.analysis.sample}

      IMAGE_ANALYSIS_STORAGE_PROVIDER: ${IMAGE_ANALYSIS_STORAGE_PROVIDER:-MINIO}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio.example.internal:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-change-this-minio-access-key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-this-minio-secret-key}
      MINIO_BUCKET: ${MINIO_BUCKET:-media}
      MINIO_SECURE: ${MINIO_SECURE:-true}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-}
      COS_BUCKET: ${COS_BUCKET:-}
    ports:
      - "${IMAGE_ANALYSIS_BIND_IP:-0.0.0.0}:${IMAGE_ANALYSIS_PORT:-8013}:8013"
    volumes:
      - ${IMAGE_ANALYSIS_LOG_PATH:-/opt/mediafleet/logs/image-analysis}:/app/logs
      - ${IMAGE_ANALYSIS_TEMP_PATH:-/opt/mediafleet/temp/image-analysis}:/tmp/image-analysis
    restart: unless-stopped
    networks: [mediafleet-network]
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8013/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  mediafleet-network:
    external: true
