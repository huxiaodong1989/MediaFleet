name: mediafleet

# Portainer/现场完整 Stack。
# 所有业务环境变量都直接写在本文件的 environment 中，不依赖 env_file。
# 在 Portainer Stack variables 或同目录 .env 中替换 ${...} 的值即可。
# 外部依赖：MySQL、RabbitMQ、MinIO/COS 和 ZLMediaKit；本 Stack 不创建 Redis。
x-healthcheck: &healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

x-database: &database
  # MySQL 是节点、绑定、任务和产物的事实来源。生产稳定运行后自动初始化/迁移应保持 false。
  DB_TYPE: ${DB_TYPE:-mysql}
  DB_HOST: ${DB_HOST:-mysql.example.internal}
  DB_PORT: ${DB_PORT:-3306}
  DB_USER: ${DB_USER:-mediafleet}
  DB_PASSWORD: ${DB_PASSWORD:-change-this-db-password}
  DB_NAME: ${DB_NAME:-mediafleet}
  DB_CHARSET: ${DB_CHARSET:-utf8mb4}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
  DB_AUTO_INIT: ${DB_AUTO_INIT:-false}
  DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-false}
  DB_INIT_CREATE_SCHEMA: ${DB_INIT_CREATE_SCHEMA:-false}
  DB_DM_MYSQL_COMPAT: ${DB_DM_MYSQL_COMPAT:-true}

x-rabbitmq: &rabbitmq
  # RabbitMQ 负责通用媒体任务和定向录制命令传输；同一集群服务必须使用相同 vhost。
  RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq.example.internal}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_USER: ${RABBITMQ_USER:-media_service}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-change-this-rabbitmq-password}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
  RABBITMQ_HEARTBEAT: ${RABBITMQ_HEARTBEAT:-60}
  RABBITMQ_BLOCKED_TIMEOUT: ${RABBITMQ_BLOCKED_TIMEOUT:-300}
  RABBITMQ_MAX_TASKS: ${RABBITMQ_MAX_TASKS:-1}
  RABBITMQ_RECORD_RESULT_EXCHANGE: ${RABBITMQ_RECORD_RESULT_EXCHANGE:-mediafleet.callback.fanout.exchange}
  RABBITMQ_RECORD_RESULT_TTL: ${RABBITMQ_RECORD_RESULT_TTL:-36000000}
  RABBITMQ_WORKER_RESULT_EXCHANGE: ${RABBITMQ_WORKER_RESULT_EXCHANGE:-mediafleet.worker.exchange}
  RABBITMQ_WORKER_RESULT_TTL: ${RABBITMQ_WORKER_RESULT_TTL:-36000000}

services:
  control-center:
    image: ${CONTROL_CENTER_IMAGE:-mediafleet-control-center:stable}
    container_name: ${CONTROL_CENTER_CONTAINER_NAME:-mediafleet-control-center}
    environment:
      # ---------- 调用中心基础配置 ----------
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: "8008"
      SERVICE_DOTENV_ENABLED: "false"
      SERVICE_LOG_LEVEL: ${CONTROL_CENTER_LOG_LEVEL:-INFO}
      API_KEY: ${CONTROL_CENTER_API_KEY:-change-this-api-key}
      APP_ENV: ${APP_ENV:-production}
      TZ: ${TZ:-Asia/Shanghai}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      <<: [*database, *rabbitmq]
      # 多实例部署时每个调用中心必须使用不同实例编号。
      CONTROL_CENTER_INSTANCE_ID: ${CONTROL_CENTER_INSTANCE_ID:-control-center-01}
      # 每轮发布数量与轮询间隔；这里只控制发布速度，不控制 Worker 处理并发。
      TASK_DISPATCH_BATCH_SIZE: ${TASK_DISPATCH_BATCH_SIZE:-20}
      TASK_DISPATCH_POLL_INTERVAL_SECONDS: ${TASK_DISPATCH_POLL_INTERVAL_SECONDS:-1}
      TASK_DISPATCH_LOCK_TIMEOUT_SECONDS: ${TASK_DISPATCH_LOCK_TIMEOUT_SECONDS:-300}
      TASK_DISPATCH_ERROR_BACKOFF_SECONDS: ${TASK_DISPATCH_ERROR_BACKOFF_SECONDS:-5}
      # 定向录制命令发布参数。
      RECORDING_COMMAND_DISPATCH_BATCH_SIZE: ${RECORDING_COMMAND_DISPATCH_BATCH_SIZE:-20}
      RECORDING_COMMAND_DISPATCH_POLL_INTERVAL_SECONDS: ${RECORDING_COMMAND_DISPATCH_POLL_INTERVAL_SECONDS:-1}
      RECORDING_COMMAND_DISPATCH_LOCK_TIMEOUT_SECONDS: ${RECORDING_COMMAND_DISPATCH_LOCK_TIMEOUT_SECONDS:-10}
      RECORDING_COMMAND_DISPATCH_ERROR_BACKOFF_SECONDS: ${RECORDING_COMMAND_DISPATCH_ERROR_BACKOFF_SECONDS:-5}
      # 录制计划容量预约的前后安全余量，单位秒。
      RECORDING_RESERVATION_MARGIN_SECONDS: ${RECORDING_RESERVATION_MARGIN_SECONDS:-5}
      # 当前执行节点直接更新 MySQL 和回调，事件消费者通常保持关闭。
      CONTROL_CENTER_EVENT_CONSUMER_ENABLED: ${CONTROL_CENTER_EVENT_CONSUMER_ENABLED:-false}
      CONTROL_CENTER_EVENT_QUEUE_NAME: ${CONTROL_CENTER_EVENT_QUEUE_NAME:-control-center.media-events}
      CONTROL_CENTER_EVENT_ROUTING_KEYS: ${CONTROL_CENTER_EVENT_ROUTING_KEYS:-task.completed,task.failed}
      CONTROL_CENTER_EVENT_PREFETCH_COUNT: ${CONTROL_CENTER_EVENT_PREFETCH_COUNT:-10}
      CONTROL_CENTER_EVENT_RETRY_DELAY_MILLISECONDS: ${CONTROL_CENTER_EVENT_RETRY_DELAY_MILLISECONDS:-5000}
      CONTROL_CENTER_EVENT_MAX_ATTEMPTS: ${CONTROL_CENTER_EVENT_MAX_ATTEMPTS:-3}
      CONTROL_CENTER_EVENT_RECONNECT_DELAY_SECONDS: ${CONTROL_CENTER_EVENT_RECONNECT_DELAY_SECONDS:-5}
      CONTROL_CENTER_CALLBACK_TIMEOUT_SECONDS: ${CONTROL_CENTER_CALLBACK_TIMEOUT_SECONDS:-10}
    ports:
      - "${CONTROL_CENTER_BIND_IP:-0.0.0.0}:${CONTROL_CENTER_PORT:-8008}:8008"
    volumes:
      - ${CONTROL_CENTER_LOG_PATH:-/opt/mediafleet/logs/control-center}:/app/logs
    restart: unless-stopped
    networks: [mediafleet-network]
    healthcheck:
      <<: *healthcheck
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health', timeout=5)"]

  recorder-node:
    image: ${RECORDER_NODE_IMAGE:-mediafleet-recorder-node:stable}
    container_name: ${RECORDER_NODE_CONTAINER_NAME:-mediafleet-recorder-node}
    environment:
      # ---------- 录制节点基础配置 ----------
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: "8010"
      SERVICE_DOTENV_ENABLED: "false"
      SERVICE_LOG_LEVEL: ${RECORDER_NODE_LOG_LEVEL:-INFO}
      API_KEY: ${RECORDER_NODE_API_KEY:-change-this-api-key}
      APP_ENV: ${APP_ENV:-production}
      TZ: ${TZ:-Asia/Shanghai}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      <<: [*database, *rabbitmq]
      # ---------- 心跳和稳定身份 ----------
      MEDIA_NODE_HEARTBEAT_CONTROL_CENTER_URL: ${MEDIA_NODE_HEARTBEAT_CONTROL_CENTER_URL:-http://mediafleet-control-center:8008}
      MEDIA_NODE_AGENT_URL: ${MEDIA_NODE_AGENT_URL:-http://mediafleet-recorder-node:8010}
      MEDIA_NODE_NAME: ${MEDIA_NODE_NAME:-recorder-node-01}
      MEDIA_NODE_WEIGHT: ${MEDIA_NODE_WEIGHT:-100}
      MEDIA_NODE_HEARTBEAT_INTERVAL_SECONDS: ${MEDIA_NODE_HEARTBEAT_INTERVAL_SECONDS:-30}
      MEDIA_NODE_HEARTBEAT_TIMEOUT_SECONDS: ${MEDIA_NODE_HEARTBEAT_TIMEOUT_SECONDS:-5}
      # 每台 ZL/recorder 录制单元必须使用唯一且跨重启稳定的编号。
      RECORDER_NODE_ID: ${RECORDER_NODE_ID:-recorder-node-01}
      RECORDER_SERVER_ID: ${RECORDER_SERVER_ID:-recording-server-01}
      # 单节点实际同时录制硬上限；100 是配置上限，不代表已完成 100 路容量验收。
      RECORDER_NODE_MAX_RECORDINGS: ${RECORDER_NODE_MAX_RECORDINGS:-100}
      # 最大粘性绑定数，不是同时录制数。
      RECORDER_NODE_MAX_BINDINGS: ${RECORDER_NODE_MAX_BINDINGS:-300}
      # 可用磁盘低于此值时节点停止承接新任务。
      RECORDER_NODE_MIN_FREE_DISK_GB: ${RECORDER_NODE_MIN_FREE_DISK_GB:-10}
      # ---------- 录制命令消费；prefetch 不限制正在运行的录制路数 ----------
      RECORDER_NODE_COMMAND_PREFETCH_COUNT: ${RECORDER_NODE_COMMAND_PREFETCH_COUNT:-1}
      RECORDER_NODE_COMMAND_RETRY_DELAY_MILLISECONDS: ${RECORDER_NODE_COMMAND_RETRY_DELAY_MILLISECONDS:-5000}
      RECORDER_NODE_COMMAND_MAX_ATTEMPTS: ${RECORDER_NODE_COMMAND_MAX_ATTEMPTS:-3}
      RECORDER_NODE_COMMAND_RECONNECT_DELAY_SECONDS: ${RECORDER_NODE_COMMAND_RECONNECT_DELAY_SECONDS:-5}
      RECORDER_NODE_COMMAND_ACCEPT_TIMEOUT_SECONDS: ${RECORDER_NODE_COMMAND_ACCEPT_TIMEOUT_SECONDS:-10}
      # ---------- 配套 ZLMediaKit ----------
      # ZLM_SERVER_ID 也是统一播放地址中的 Nginx 节点路径，例如 zlm-01。
      ZLM_SERVER_ID: ${ZLM_SERVER_ID:-zlm-01}
      ZLM_API_URL: ${ZLM_API_URL:-http://zlm.example.internal:8080}
      ZLM_URL: ${ZLM_URL:-http://zlm.example.internal:8080}
      ZLM_SECRET: ${ZLM_SECRET:-change-this-zlm-secret}
      # 容器内统一使用此路径；宿主机路径只在 volumes 的 ZLM_RECORD_PATH 中配置。
      ZLM_RECORD_LOCAL_ROOT: /data/zlmediakit/record
      # ZL API 总并发以及录制文件发现/状态快照参数，不等于录制容量。
      ZLM_API_CONCURRENCY: ${ZLM_API_CONCURRENCY:-32}
      ZLM_RECORD_DISCOVERY_ATTEMPTS: ${ZLM_RECORD_DISCOVERY_ATTEMPTS:-3}
      ZLM_RECORD_DISCOVERY_INTERVAL: ${ZLM_RECORD_DISCOVERY_INTERVAL:-5}
      ZLM_STREAM_STATUS_INTERVAL: ${ZLM_STREAM_STATUS_INTERVAL:-10}
      ZLM_STREAM_STATUS_STALE_GRACE: ${ZLM_STREAM_STATUS_STALE_GRACE:-30}
      ZLM_STREAM_STATUS_LOG_INTERVAL: ${ZLM_STREAM_STATUS_LOG_INTERVAL:-60}
      ZLM_RECORD_STATUS_CONCURRENCY: ${ZLM_RECORD_STATUS_CONCURRENCY:-8}
      ZLM_RECORD_RESTART_INTERVAL: ${ZLM_RECORD_RESTART_INTERVAL:-5}
      ZLM_STREAM_ABSENCE_CONFIRMATIONS: ${ZLM_STREAM_ABSENCE_CONFIRMATIONS:-3}
      # 统一播放入口应填写 Nginx 域名/IP；不要填写某台 ZL 内网地址。
      ZLM_PLAY_HOST: ${ZLM_PLAY_HOST:-media.example.com}
      ZLM_PLAY_PORT: ${ZLM_PLAY_PORT:-443}
      ZLM_PLAY_PROTOCOL: ${ZLM_PLAY_PROTOCOL:-https}
      ZLM_RTMP_PORT: ${ZLM_RTMP_PORT:-1935}
      ZLM_RTSP_PORT: ${ZLM_RTSP_PORT:-554}
      # ---------- 录制后处理并发 ----------
      # Worker 线程总数和重 IO/FFmpeg 阶段并发是两个不同限制。
      POST_PROCESSING_MAX_WORKERS: ${POST_PROCESSING_MAX_WORKERS:-3}
      POST_PROCESSING_MEDIA_CONCURRENCY: ${POST_PROCESSING_MEDIA_CONCURRENCY:-2}
      # 开启后：达到阈值后随录制压力线性降低，满载默认仍保留 50% 并发。
      POST_PROCESSING_IDLE_STRATEGY_ENABLED: ${POST_PROCESSING_IDLE_STRATEGY_ENABLED:-false}
      POST_PROCESSING_BUSY_RECORDING_THRESHOLD: ${POST_PROCESSING_BUSY_RECORDING_THRESHOLD:-50}
      POST_PROCESSING_BUSY_MEDIA_PERCENT: ${POST_PROCESSING_BUSY_MEDIA_PERCENT:-50}
      POST_PROCESSING_BUSY_MEDIA_CONCURRENCY: ${POST_PROCESSING_BUSY_MEDIA_CONCURRENCY:-1}
      POST_PROCESSING_IDLE_STRATEGY_POLL_INTERVAL_SECONDS: ${POST_PROCESSING_IDLE_STRATEGY_POLL_INTERVAL_SECONDS:-1}
      POST_PROCESSING_DB_SAVE_MAX_ATTEMPTS: ${POST_PROCESSING_DB_SAVE_MAX_ATTEMPTS:-5}
      POST_PROCESSING_DB_SAVE_RETRY_DELAY_SECONDS: ${POST_PROCESSING_DB_SAVE_RETRY_DELAY_SECONDS:-5}
      POST_PROCESSING_FAILED_AUTO_RETRY_ENABLED: ${POST_PROCESSING_FAILED_AUTO_RETRY_ENABLED:-true}
      POST_PROCESSING_FAILED_AUTO_RETRY_MAX_ATTEMPTS: ${POST_PROCESSING_FAILED_AUTO_RETRY_MAX_ATTEMPTS:-3}
      POST_PROCESSING_FAILED_AUTO_RETRY_INITIAL_DELAY_SECONDS: ${POST_PROCESSING_FAILED_AUTO_RETRY_INITIAL_DELAY_SECONDS:-60}
      POST_PROCESSING_FAILED_AUTO_RETRY_MAX_DELAY_SECONDS: ${POST_PROCESSING_FAILED_AUTO_RETRY_MAX_DELAY_SECONDS:-900}
      POST_PROCESSING_FAILED_AUTO_RETRY_SCAN_INTERVAL_SECONDS: ${POST_PROCESSING_FAILED_AUTO_RETRY_SCAN_INTERVAL_SECONDS:-30}
      POST_PROCESSING_PRIORITY_HIGH: ${POST_PROCESSING_PRIORITY_HIGH:-10}
      POST_PROCESSING_PRIORITY_NORMAL: ${POST_PROCESSING_PRIORITY_NORMAL:-5}
      POST_PROCESSING_PRIORITY_LOW: ${POST_PROCESSING_PRIORITY_LOW:-1}
      POST_PROCESSING_TIMEOUT_VIDEO_INFO: ${POST_PROCESSING_TIMEOUT_VIDEO_INFO:-60}
      POST_PROCESSING_TIMEOUT_AUDIO_EXTRACT: ${POST_PROCESSING_TIMEOUT_AUDIO_EXTRACT:-300}
      POST_PROCESSING_TIMEOUT_COVER_EXTRACT: ${POST_PROCESSING_TIMEOUT_COVER_EXTRACT:-120}
      POST_PROCESSING_TIMEOUT_VIDEO_UPLOAD: ${POST_PROCESSING_TIMEOUT_VIDEO_UPLOAD:-600}
      POST_PROCESSING_TIMEOUT_AUDIO_UPLOAD: ${POST_PROCESSING_TIMEOUT_AUDIO_UPLOAD:-300}
      POST_PROCESSING_TIMEOUT_COVER_UPLOAD: ${POST_PROCESSING_TIMEOUT_COVER_UPLOAD:-60}
      MEDIA_TEMP_DIR: /tmp/media-processing
      # ---------- 对象存储：只支持 MinIO/S3 或 COS ----------
      STORAGE_TYPE: ${STORAGE_TYPE:-minio}
      STORAGE_AUDIO_TYPE: ${STORAGE_AUDIO_TYPE:-minio}
      STORAGE_DOWNLOAD_PATH: /tmp/media-processing/download
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio.example.internal:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-change-this-minio-access-key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-this-minio-secret-key}
      MINIO_BUCKET: ${MINIO_BUCKET:-media}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_APPID: ${MINIO_APPID:-}
      MINIO_CALLBACK_URL: ${MINIO_CALLBACK_URL:-}
      MINIO_CALLBACK_FALLBACK_ENABLED: ${MINIO_CALLBACK_FALLBACK_ENABLED:-false}
      MINIO_CALLBACK_MAX_RETRIES: ${MINIO_CALLBACK_MAX_RETRIES:-3}
      MINIO_CALLBACK_TIMEOUT: ${MINIO_CALLBACK_TIMEOUT:-45}
      MINIO_FILEURL_HEAD: ${MINIO_FILEURL_HEAD:-https://media.example.com/files}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_APPID: ${COS_APPID:-}
      COS_CALLBACK_URL: ${COS_CALLBACK_URL:-}
      COS_CALLBACK_FALLBACK_ENABLED: ${COS_CALLBACK_FALLBACK_ENABLED:-false}
      COS_CALLBACK_MAX_RETRIES: ${COS_CALLBACK_MAX_RETRIES:-3}
      COS_CALLBACK_TIMEOUT: ${COS_CALLBACK_TIMEOUT:-45}
      COS_DOMAIN: ${COS_DOMAIN:-}
      COS_FILEURL_HEAD: ${COS_FILEURL_HEAD:-}
    ports:
      - "${RECORDER_NODE_BIND_IP:-0.0.0.0}:${RECORDER_NODE_PORT:-8010}:8010"
    volumes:
      - ${RECORDER_NODE_LOG_PATH:-/opt/mediafleet/logs/recorder-node}:/app/logs
      - ${RECORDER_NODE_TEMP_PATH:-/opt/mediafleet/temp/recorder-node}:/tmp/media-processing
      - ${ZLM_RECORD_PATH:-/opt/zlmediakit/www/record}:/data/zlmediakit/record
    restart: unless-stopped
    networks: [mediafleet-network]
    depends_on:
      control-center: {condition: service_healthy}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=5)"]

  media-worker:
    image: ${MEDIA_WORKER_IMAGE:-mediafleet-worker:stable}
    container_name: ${MEDIA_WORKER_CONTAINER_NAME:-mediafleet-worker}
    environment:
      # ---------- CPU 媒体 Worker 基础配置 ----------
      SERVICE_HOST: 0.0.0.0
      SERVICE_PORT: "8009"
      SERVICE_DOTENV_ENABLED: "false"
      SERVICE_LOG_LEVEL: ${MEDIA_WORKER_LOG_LEVEL:-INFO}
      API_KEY: ${MEDIA_WORKER_API_KEY:-change-this-api-key}
      APP_ENV: ${APP_ENV:-production}
      TZ: ${TZ:-Asia/Shanghai}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      <<: [*database, *rabbitmq]
      # ---------- 心跳和共享队列 ----------
      MEDIA_NODE_HEARTBEAT_CONTROL_CENTER_URL: ${MEDIA_NODE_HEARTBEAT_CONTROL_CENTER_URL:-http://mediafleet-control-center:8008}
      MEDIA_NODE_AGENT_URL: ${MEDIA_WORKER_AGENT_URL:-http://media-worker:8009}
      MEDIA_NODE_NAME: ${MEDIA_WORKER_NODE_NAME:-media-worker-cpu-01}
      MEDIA_NODE_WEIGHT: ${MEDIA_WORKER_NODE_WEIGHT:-100}
      MEDIA_NODE_HEARTBEAT_INTERVAL_SECONDS: ${MEDIA_NODE_HEARTBEAT_INTERVAL_SECONDS:-30}
      MEDIA_NODE_HEARTBEAT_TIMEOUT_SECONDS: ${MEDIA_NODE_HEARTBEAT_TIMEOUT_SECONDS:-5}
      # 所有 Worker 必须使用同一个队列名；CPU ASR 的 prefetch 建议保持 1。
      MEDIA_WORKER_QUEUE_NAME: ${MEDIA_WORKER_QUEUE_NAME:-media-worker.tasks}
      MEDIA_WORKER_PREFETCH_COUNT: ${MEDIA_WORKER_PREFETCH_COUNT:-1}
      MEDIA_WORKER_CALLBACK_TIMEOUT_SECONDS: ${MEDIA_WORKER_CALLBACK_TIMEOUT_SECONDS:-10}
      MEDIA_WORKER_CALLBACK_MAX_RETRIES: ${MEDIA_WORKER_CALLBACK_MAX_RETRIES:-3}
      MEDIA_WORKER_CALLBACK_RETRY_INTERVAL_SECONDS: ${MEDIA_WORKER_CALLBACK_RETRY_INTERVAL_SECONDS:-5}
      MEDIA_WORKER_EXECUTION_TIMEOUT_SECONDS: ${MEDIA_WORKER_EXECUTION_TIMEOUT_SECONDS:-1800}
      # 租约时间应大于最长任务耗时，续租间隔必须小于租约时长。
      MEDIA_WORKER_EXECUTION_LEASE_SECONDS: ${MEDIA_WORKER_EXECUTION_LEASE_SECONDS:-1800}
      MEDIA_WORKER_EXECUTION_LEASE_RENEW_SECONDS: ${MEDIA_WORKER_EXECUTION_LEASE_RENEW_SECONDS:-600}
      MEDIA_FFMPEG_PATH: ffmpeg
      MEDIA_FFPROBE_PATH: ffprobe
      MEDIA_TEMP_DIR: /tmp/media-processing
      MEDIA_MAX_UPLOAD_SIZE: ${MEDIA_MAX_UPLOAD_SIZE:-104857600}
      # 单实例 ASR 任务并发，CPU 建议保持 1。
      MEDIA_RECOG_CONCURRENCY: ${MEDIA_RECOG_CONCURRENCY:-1}
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-resource/models/yolo/yolov8n_head_100.pt}
      # ---------- ASR：CPU 默认使用 FunASR ----------
      ASR_PROVIDER: ${ASR_PROVIDER:-funasr}
      FUNASR_MODEL_TYPE: ${FUNASR_MODEL_TYPE:-paraformer}
      FUNASR_DEVICE: ${FUNASR_DEVICE:-cpu}
      # 启动阶段完成模型下载和加载，成功后才上报心跳、开始消费任务。
      FUNASR_PRELOAD: ${FUNASR_PRELOAD:-true}
      # 禁止运行时检查模型更新，避免生产启动结果不确定。
      FUNASR_DISABLE_UPDATE: ${FUNASR_DISABLE_UPDATE:-true}
      FUNASR_NCPU: ${FUNASR_NCPU:-4}
      FUNASR_CPU_CONCURRENCY: ${FUNASR_CPU_CONCURRENCY:-1}
      FUNASR_GPU_CONCURRENCY: ${FUNASR_GPU_CONCURRENCY:-1}
      FUNASR_BATCH_SIZE_S: ${FUNASR_BATCH_SIZE_S:-60}
      FUNASR_VAD_MAX_SEGMENT_MS: ${FUNASR_VAD_MAX_SEGMENT_MS:-30000}
      FUNASR_MERGE_VAD: ${FUNASR_MERGE_VAD:-true}
      FUNASR_MERGE_LENGTH_S: ${FUNASR_MERGE_LENGTH_S:-15}
      FUNASR_PARAFORMER_ZH_MODEL: ${FUNASR_PARAFORMER_ZH_MODEL:-iic/speech_seaco_paraformer_large_asr_nat-zh-cn-16k-common-vocab8404-pytorch}
      FUNASR_PARAFORMER_EN_MODEL: ${FUNASR_PARAFORMER_EN_MODEL:-iic/speech_paraformer_asr-en-16k-vocab4199-pytorch}
      FUNASR_VAD_MODEL: ${FUNASR_VAD_MODEL:-damo/speech_fsmn_vad_zh-cn-16k-common-pytorch}
      FUNASR_PUNC_MODEL: ${FUNASR_PUNC_MODEL:-damo/punc_ct-transformer_zh-cn-common-vocab272727-pytorch}
      FUNASR_SPK_MODEL: ${FUNASR_SPK_MODEL:-damo/speech_campplus_sv_zh-cn_16k-common}
      FUNASR_SENSEVOICE_MODEL: ${FUNASR_SENSEVOICE_MODEL:-iic/SenseVoiceSmall}
      FUNASR_SENSEVOICE_LANGUAGE: ${FUNASR_SENSEVOICE_LANGUAGE:-auto}
      FUNASR_SENSEVOICE_USE_ITN: ${FUNASR_SENSEVOICE_USE_ITN:-true}
      FUNASR_SENSEVOICE_OUTPUT_TIMESTAMP: ${FUNASR_SENSEVOICE_OUTPUT_TIMESTAMP:-true}
      FUNASR_SENSEVOICE_TRUST_REMOTE_CODE: ${FUNASR_SENSEVOICE_TRUST_REMOTE_CODE:-true}
      # GLM 一般在 GPU Worker 启用；CPU 验证可用但性能不适合高并发。
      GLM_ASR_MODEL: ${GLM_ASR_MODEL:-/root/.cache/modelscope/hub/models/ZhipuAI/GLM-ASR-Nano-2512}
      GLM_ASR_DEVICE: ${GLM_ASR_DEVICE:-cpu}
      GLM_ASR_PRELOAD: ${GLM_ASR_PRELOAD:-true}
      GLM_ASR_VAD_MODEL: ${GLM_ASR_VAD_MODEL:-fsmn-vad}
      GLM_ASR_BATCH_SIZE: ${GLM_ASR_BATCH_SIZE:-32}
      GLM_ASR_MAX_GAP_MS: ${GLM_ASR_MAX_GAP_MS:-700}
      GLM_ASR_MAX_SEGMENT_MS: ${GLM_ASR_MAX_SEGMENT_MS:-30000}
      GLM_ASR_MIN_SEGMENT_MS: ${GLM_ASR_MIN_SEGMENT_MS:-800}
      GLM_ASR_RECOGNITION_CONTEXT_MS: ${GLM_ASR_RECOGNITION_CONTEXT_MS:-0}
      GLM_ASR_MIN_RECOGNITION_MS: ${GLM_ASR_MIN_RECOGNITION_MS:-0}
      GLM_ASR_MAX_NEW_TOKENS: ${GLM_ASR_MAX_NEW_TOKENS:-128}
      GLM_ASR_NO_REPEAT_NGRAM_SIZE: ${GLM_ASR_NO_REPEAT_NGRAM_SIZE:-0}
      GLM_ASR_REPETITION_PENALTY: ${GLM_ASR_REPETITION_PENALTY:-1.0}
      GLM_ASR_LENGTH_PENALTY: ${GLM_ASR_LENGTH_PENALTY:-1.0}
      GLM_ASR_PROMPT: ${GLM_ASR_PROMPT:-请将音频转写成简体中文文本。}
      GLM_ASR_KEEP_CHUNKS: ${GLM_ASR_KEEP_CHUNKS:-false}
      GLM_ASR_CPU_CONCURRENCY: ${GLM_ASR_CPU_CONCURRENCY:-1}
      GLM_ASR_GPU_CONCURRENCY: ${GLM_ASR_GPU_CONCURRENCY:-1}
      # ---------- 对象存储 ----------
      STORAGE_TYPE: ${STORAGE_TYPE:-minio}
      STORAGE_AUDIO_TYPE: ${STORAGE_AUDIO_TYPE:-minio}
      STORAGE_DOWNLOAD_PATH: /tmp/media-processing/download
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio.example.internal:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-change-this-minio-access-key}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-change-this-minio-secret-key}
      MINIO_BUCKET: ${MINIO_BUCKET:-media}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_APPID: ${MINIO_APPID:-}
      MINIO_CALLBACK_URL: ${MINIO_CALLBACK_URL:-}
      MINIO_CALLBACK_FALLBACK_ENABLED: ${MINIO_CALLBACK_FALLBACK_ENABLED:-false}
      MINIO_CALLBACK_MAX_RETRIES: ${MINIO_CALLBACK_MAX_RETRIES:-3}
      MINIO_CALLBACK_TIMEOUT: ${MINIO_CALLBACK_TIMEOUT:-45}
      MINIO_FILEURL_HEAD: ${MINIO_FILEURL_HEAD:-https://media.example.com/files}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-ap-guangzhou}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_APPID: ${COS_APPID:-}
      COS_CALLBACK_URL: ${COS_CALLBACK_URL:-}
      COS_CALLBACK_FALLBACK_ENABLED: ${COS_CALLBACK_FALLBACK_ENABLED:-false}
      COS_CALLBACK_MAX_RETRIES: ${COS_CALLBACK_MAX_RETRIES:-3}
      COS_CALLBACK_TIMEOUT: ${COS_CALLBACK_TIMEOUT:-45}
      COS_DOMAIN: ${COS_DOMAIN:-}
      COS_FILEURL_HEAD: ${COS_FILEURL_HEAD:-}
    ports:
      - "${MEDIA_WORKER_BIND_IP:-0.0.0.0}:${MEDIA_WORKER_PORT:-8009}:8009"
    volumes:
      # ModelScope 缓存必须持久化，否则重建容器会重新下载 ASR 模型。
      - ${MEDIA_WORKER_LOG_PATH:-/opt/mediafleet/logs/media-worker}:/app/logs
      - ${MEDIA_WORKER_TEMP_PATH:-/opt/mediafleet/temp/media-worker}:/tmp/media-processing
      - ${MEDIA_WORKER_DATA_PATH:-/opt/mediafleet/data/media-worker}:/app/data
      # 持久化模型缓存，重新创建容器或升级镜像后不重复下载。
      - ${MODELSCOPE_CACHE_PATH:-/opt/mediafleet/models/modelscope}:/root/.cache/modelscope
    restart: unless-stopped
    networks: [mediafleet-network]
    depends_on:
      control-center: {condition: service_healthy}
    healthcheck:
      <<: *healthcheck
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8009/health', timeout=5)"]
      start_period: 300s

networks:
  mediafleet-network:
    external: true
