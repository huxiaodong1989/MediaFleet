name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan complete Git history
        run: |
          # 首次导入包含独立根提交，增量范围可能生成不存在的 `<root>^`。
          # 固定镜像并扫描完整历史，避免首次推送和后续合并提交漏检。
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 \
            git /repo --redact --exit-code=1 --log-opts=--all
