name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv lock --check
      - run: uv run ruff check media_platform services tests packages
      - run: uv run python -m compileall media_platform services packages
      - run: uv build
      - run: uv build --package mediafleet-sdk
      - run: uv build --package mediafleet-cli
      - run: uv build --package mediafleet-mcp
      - name: Validate Docker Compose files
        shell: bash
        run: |
          while IFS= read -r file; do
            env_file=.env.example
            if [[ "$file" == *"/quickstart/"* ]]; then
              env_file=deploy/compose/quickstart/.env.example
            fi
            docker compose --env-file "$env_file" -f "$file" config --quiet
          done < <(find deploy/compose -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.20"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      - run: uv run python -m pytest -q

  sdk:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.20"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --package mediafleet-sdk
      - run: uv run --frozen --package mediafleet-sdk pytest -q packages/mediafleet-sdk/tests
      - name: Validate lightweight SDK dependencies
        shell: bash
        run: |
          uv run --frozen --package mediafleet-sdk python - <<'PY'
          import importlib.util
          from mediafleet_sdk import AsyncMediaFleetClient, MediaFleetClient

          assert MediaFleetClient
          assert AsyncMediaFleetClient
          for package in ("fastapi", "sqlalchemy", "pika", "torch"):
              assert importlib.util.find_spec(package) is None, package
          PY

  cli:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.20"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --package mediafleet-cli
      - run: uv run --frozen --package mediafleet-cli pytest -q packages/mediafleet-cli/tests
      - run: uv run --frozen --package mediafleet-cli mediafleet --help
      - name: Validate installed CLI wheels
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/mediafleet-cli-wheels"
          venv_dir="$RUNNER_TEMP/mediafleet-cli-wheel-venv"
          mkdir -p "$artifact_dir"
          uv build --package mediafleet-sdk --out-dir "$artifact_dir"
          uv build --package mediafleet-cli --out-dir "$artifact_dir"
          uv venv "$venv_dir" --python "${{ matrix.python-version }}"
          uv pip install --python "$venv_dir/bin/python" \
            "$artifact_dir"/mediafleet_sdk-*.whl \
            "$artifact_dir"/mediafleet_cli-*.whl
          "$venv_dir/bin/mediafleet" --help
          "$venv_dir/bin/mediafleet" version --json
      - name: Validate lightweight CLI dependencies
        shell: bash
        run: |
          uv run --frozen --package mediafleet-cli python - <<'PY'
          import importlib.util
          from mediafleet_cli.main import app

          assert app
          for package in ("fastapi", "sqlalchemy", "pika", "torch"):
              assert importlib.util.find_spec(package) is None, package
          PY
      - name: Audit CLI dependencies
        if: matrix.python-version == '3.12'
        run: uv run --frozen --package mediafleet-cli --with pip-audit pip-audit --progress-spinner off

  mcp:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.20"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen --package mediafleet-mcp
      - run: uv run --frozen --package mediafleet-mcp pytest -q services/mcp_server/tests
      - name: Validate installed MCP wheels
        if: matrix.python-version == '3.12'
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/mediafleet-mcp-wheels"
          venv_dir="$RUNNER_TEMP/mediafleet-mcp-wheel-venv"
          mkdir -p "$artifact_dir"
          uv build --package mediafleet-sdk --out-dir "$artifact_dir"
          uv build --package mediafleet-mcp --out-dir "$artifact_dir"
          uv venv "$venv_dir" --python "${{ matrix.python-version }}"
          uv pip install --python "$venv_dir/bin/python" \
            "$artifact_dir"/mediafleet_sdk-*.whl \
            "$artifact_dir"/mediafleet_mcp-*.whl
          "$venv_dir/bin/python" -c \
            "from mediafleet_mcp.server import server; assert server.name == 'mediafleet'"
      - name: Validate MCP dependency boundary
        shell: bash
        run: |
          uv run --frozen --package mediafleet-mcp python - <<'PY'
          import importlib.util
          from mediafleet_mcp.server import server

          assert server.name == "mediafleet"
          for package in ("fastapi", "sqlalchemy", "pika", "torch", "keyring"):
              assert importlib.util.find_spec(package) is None, package
          PY
      - name: Audit MCP dependencies
        if: matrix.python-version == '3.12'
        run: uv run --frozen --package mediafleet-mcp --with pip-audit pip-audit --progress-spinner off

  media-worker-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen --no-dev --extra media-worker
      - name: Validate media worker ML stack
        run: uv run --no-sync python -c "import kaldi_native_fbank, torch, torchvision; print(torch.__version__, torchvision.__version__)"
      - name: Audit media worker dependencies
        run: uv run --no-sync --with pip-audit pip-audit --progress-spinner off

  image-analysis-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen --no-dev --extra image-analysis
      - name: Validate image analysis runtime imports
        run: uv run --no-sync python -c "import openai; from services.image_analysis.main import app; print(app.title)"

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --with pip-audit pip-audit --progress-spinner off
