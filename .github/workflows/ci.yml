name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv lock --check
      - run: uv run ruff check media_platform services tests
      - run: uv run python -m compileall media_platform services
      - run: uv build
      - name: Validate Docker Compose files
        shell: bash
        run: |
          while IFS= read -r file; do
            env_file=.env.example
            if [[ "$file" == *"/quickstart/"* ]]; then
              env_file=deploy/compose/quickstart/.env.example
            fi
            docker compose --env-file "$env_file" -f "$file" config --quiet
          done < <(find deploy/compose -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.20"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      - run: uv run python -m pytest -q

  media-worker-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --no-dev --extra media-worker
      - name: Validate media worker ML stack
        run: uv run --no-sync python -c "import kaldi_native_fbank, torch, torchvision; print(torch.__version__, torchvision.__version__)"
      - name: Audit media worker dependencies
        run: uv run --no-sync --with pip-audit pip-audit --progress-spinner off

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --with pip-audit pip-audit --progress-spinner off
